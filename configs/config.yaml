# ═══════════════════════════════════════════════════════════════
# CulinaryVLM — Central Configuration
# ═══════════════════════════════════════════════════════════════

project:
  name: "CulinaryVLM"
  version: "0.1.0"
  description: "Multilingual Indian Cooking Video Intelligence"

# ───────────────────────────────────────────────────────────────
# Paths (relative to project root)
# ───────────────────────────────────────────────────────────────
paths:
  dataset_excel: "Chicken_Biryani_Classified.xlsx"
  categorized_output: "datasets/categorized/video_metadata.json"
  raw_videos: "datasets/raw_videos"
  transcripts: "datasets/transcripts"
  segments: "datasets/segments"
  clusters: "datasets/clusters"
  verified: "datasets/verified"
  alignments: "datasets/alignments"
  comparisons: "datasets/comparisons"
  qa_output: "datasets/qa"
  faiss_index: "datasets/faiss"
  canonical_recipes: "configs/canonical_recipes"
  database: "datasets/culinary_vlm.db"

  # Cluster-specific paths (used in PBS scripts)
  cluster:
    storage_root: "/storage/iiitd"
    raw_videos: "/storage/iiitd/culinary_vlm/raw_videos"
    logs: "/storage/iiitd/culinary_vlm/logs"

# ───────────────────────────────────────────────────────────────
# Dataset Categorization (Phase 0A)
# ───────────────────────────────────────────────────────────────
categorization:
  excel_sheet_name: "Chicken Biryani by Style"
  header_row: 2           # 1-indexed, row containing column headers
  min_confidence: "Medium" # Minimum confidence for pipeline inclusion
  
  # Named sections in the Excel file (order matters)
  named_sections:
    - name: "Hyderabadi"
      start_row: 4
      end_row: 44
    - name: "Kolkata"
      start_row: 46
      end_row: 58
    - name: "Lucknowi"
      start_row: 60
      end_row: 67
    - name: "Malabar"
      start_row: 69
      end_row: 75
    - name: "Sindhi"
      start_row: 77
      end_row: 86
    - name: "Ambur"
      start_row: 88
      end_row: 88
    - name: "Dindigul"
      start_row: 90
      end_row: 90
    - name: "Muradabadi"
      start_row: 92
      end_row: 109
    - name: "Other"
      start_row: 111
      end_row: 584

  # Keyword-based sub-categorization for "Other" videos
  # Priority order: first match wins
  keyword_categories:
    - category: "Hyderabadi"
      confidence: "High"
      patterns:
        - "hyderabad"
        - "hyderabadi"
    - category: "Kolkata"
      confidence: "High"
      patterns:
        - "kolkata"
        - "calcutta"
        - "bengal"
    - category: "Lucknowi"
      confidence: "High"
      patterns:
        - "lucknow"
        - "lucknowi"
        - "awadhi"
    - category: "Malabar"
      confidence: "High"
      patterns:
        - "malabar"
        - "thalassery"
        - "kerala"
    - category: "Sindhi"
      confidence: "High"
      patterns:
        - "sindhi"
        - "karachi"
    - category: "Muradabadi"
      confidence: "High"
      patterns:
        - "muradabad"
        - "moradabad"
    - category: "Ambur"
      confidence: "High"
      patterns:
        - "ambur"
    - category: "Dindigul"
      confidence: "High"
      patterns:
        - "dindigul"
    - category: "Delhi"
      confidence: "High"
      patterns:
        - "delhi"
        - "dilli"
        - "jama masjid"
        - "purani dilli"
        - "old delhi"
        - "chandni chowk"
    - category: "Andhra"
      confidence: "High"
      patterns:
        - "andhra"
        - "vizag"
        - "visakhapatnam"
        - "nellore"
        - "guntur"
        - "rajahmundry"
        - "rayalaseema"
        - "kakinada"
        - "vijayawada"
        - "ongole"
        - "konaseema"
        - "chennuru"
        - "kurnool"
        - "tirupati"
    - category: "Bihari"
      confidence: "High"
      patterns:
        - "bihar"
        - "champaran"
        - "patna"
    - category: "Assamese"
      confidence: "High"
      patterns:
        - "assam"
        - "assamese"
        - "guwahati"
    - category: "Bombay"
      confidence: "High"
      patterns:
        - "bombay"
        - "mumbai"
    - category: "Kashmiri"
      confidence: "High"
      patterns:
        - "kashmir"
        - "kashmiri"
    - category: "Mughlai"
      confidence: "Medium"
      patterns:
        - "mughlai"
        - "mughal"
        - "muglai"
    - category: "Bamboo"
      confidence: "Medium"
      patterns:
        - "bamboo"
    - category: "Degi"
      confidence: "Medium"
      patterns:
        - "\\bdegi\\b"
        - "deg wali"
        - "deg mein"
    - category: "Matka"
      confidence: "Medium"
      patterns:
        - "\\bmatka\\b"
        - "\\bhandi\\b"
    - category: "Tandoori"
      confidence: "Medium"
      patterns:
        - "tandoori"
        - "tandoor"
    - category: "Arabic"
      confidence: "Low"
      patterns:
        - "\\barab"
        - "mandi"
        - "kabsa"
        - "kepsa"
        - "arabian"

  # Language detection patterns (Unicode script ranges)
  language_patterns:
    telugu:
      script_range: "\\u0C00-\\u0C7F"
      inferred_category: "Andhra"
    bengali:
      script_range: "\\u0980-\\u09FF"
      inferred_category: "Kolkata"
    malayalam:
      script_range: "\\u0D00-\\u0D7F"
      inferred_category: "Malabar"
    devanagari:
      script_range: "\\u0900-\\u097F"
      inferred_category: null  # too ambiguous — Hindi is everywhere
    arabic_urdu:
      script_range: "\\u0600-\\u06FF\\uFB50-\\uFDFF\\uFE70-\\uFEFF"
      inferred_category: "Sindhi"

# ───────────────────────────────────────────────────────────────
# Pipeline Parameters
# ───────────────────────────────────────────────────────────────
pipeline:
  download:
    min_duration_sec: 60
    max_duration_sec: 2700   # 45 minutes
    format: "bestvideo[height<=720]+bestaudio/best[height<=720]"
    rate_limit: "5M"
    
  asr:
    model: "large-v3"
    device: "cuda"           # cluster only
    batch_size: 16
    compute_type: "float16"
    
  segmentation:
    model: "OpenGVLab/InternVL2-8B"
    quantization: "4bit"
    device: "cuda"
    max_frames_per_video: 100
    
  clustering:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    threshold: 0.3
    metric: "cosine"
    device: "cpu"            # MacBook
    
  alignment:
    model: "BAAI/bge-small-en-v1.5"
    device: "cpu"
    
  comparison:
    proposer_model: "Qwen/Qwen2.5-7B-Instruct"
    retriever_model: "laion/CLIP-ViT-B-32-laion2B-s34B-b79K"
    pairs_per_class: 50
    
  qa_generation:
    easy_model: "llama-3.1-8b-instant"      # Groq model name
    medium_model: "gemini-1.5-flash"
    hard_model: "gemini-1.5-flash"
    train_split: 0.85
    
  finetuning:
    base_model: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    lora_r: 16
    lora_alpha: 32
    epochs: 3
    batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    warmup_ratio: 0.03
    dtype: "bfloat16"
    hub_repo: "culinary-vlm-11b"

# ───────────────────────────────────────────────────────────────
# API Configuration
# ───────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  model_inference: "huggingface"   # huggingface | local

# ───────────────────────────────────────────────────────────────
# Agent Layer (LangChain + LangGraph) — ISOLATED, TOGGLEABLE
# ───────────────────────────────────────────────────────────────
agent:
  enabled: true              # USE_AGENT_LAYER flag
  llm_provider: "groq"       # groq | gemini
  llm_model: "allam-2-7b"
  fallback_provider: "gemini"
  fallback_model: "gemini-1.5-flash"
  memory_backend: "memory"   # memory | sqlite
  max_retries: 1
  temperature: 0.1
