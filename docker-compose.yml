version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        INSTALL_AGENT: "${INSTALL_AGENT:-false}"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - USE_AGENT_LAYER=${USE_AGENT_LAYER:-false}
    volumes:
      - ./datasets/faiss:/app/datasets/faiss:ro
      - ./configs/canonical_recipes:/app/configs/canonical_recipes:ro
    restart: unless-stopped
    platform: linux/arm64

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    platform: linux/arm64
